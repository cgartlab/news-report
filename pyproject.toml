[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-report"
version = "0.3.0"
description = "Modular news-gathering Agent Skill — Python pipeline for RSS/search collection, LLM evaluation, and report generation"
requires-python = ">=3.10"
license = { text = "CC BY-NC-SA 4.0" }
authors = [{ name = "CGArtLab" }]
readme = "README.md"
keywords = ["news", "rss", "agent", "skill", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Creative Commons",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: RSS",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "mypy>=1.10", "pre-commit>=3.8"]
telegram = ["telethon>=1.36"]

[project.scripts]
news-report = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["src"]
