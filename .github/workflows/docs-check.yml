name: Documentation Check

on:
  pull_request:
    paths:
      - "*.md"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "*.md"
      - ".github/**"
  # 手动跑：没有 PR 时（例如分支刚推上去、或 PR 创建时 Actions 被计费停摆）
  # 也能校验文档门禁，不用为了触发检查去造一次提交。
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check markdown formatting (no trailing spaces, no tabs)
        run: |
          errors=0
          for f in *.md .github/**/*.md; do
            [ -f "$f" ] || continue
            # Check trailing whitespace
            if grep -Pn ' +$' "$f" > /dev/null; then
              echo "::warning::$f has trailing whitespace"
              grep -Pn ' +$' "$f" | head -3
              errors=$((errors + 1))
            fi
            # Check tab characters
            if grep -Pn '\t' "$f" > /dev/null; then
              echo "::warning::$f contains tab characters"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::$errors file(s) with formatting issues"
            exit 1
          fi
          echo "✓ All markdown files pass formatting check"

      - name: Check code block balance
        run: |
          python3 -c "
          import sys
          from pathlib import Path
          files = list(Path('.').glob('*.md')) + list(Path('.github').glob('**/*.md')) if Path('.github').exists() else list(Path('.').glob('*.md'))
          for f in files:
              content = f.read_text()
              fence_count = content.count('\`\`\`')
              if fence_count % 2 != 0:
                  print(f'::error::{f}: unbalanced code fences ({fence_count} occurrences)')
                  sys.exit(1)
          print('✓ All code fences balanced')
          "

      - name: Check version consistency
        run: |
          python3 -c "
          import re
          import sys
          from pathlib import Path

          # Every place that carries the project version must agree. A mismatch
          # is a hard failure: release.yml gates on the same three files, so a
          # stale value here would only surface at tag time.
          checks = [
              ('SKILL.md',     'frontmatter', r'^version:[ \t]*(\d+\.\d+\.\d+)[ \t]*$'),
              ('SKILL.md',     'prose',       r'\*\*Skill 版本\*\*：v(\d+\.\d+\.\d+)'),
              ('pyproject.toml','project',    r'^version[ \t]*=[ \t]*\"(\d+\.\d+\.\d+)\"'),
              ('CHANGELOG.md', 'latest',      r'^## \[(\d+\.\d+\.\d+)\]'),
              ('AGENTS.md',    'prose',       r'\*\*项目版本\*\*：v(\d+\.\d+\.\d+)'),
          ]

          found = {}
          missing = []
          for name, where, pattern in checks:
              f = Path(name)
              if not f.exists():
                  missing.append(f'{name} does not exist')
                  continue
              m = re.search(pattern, f.read_text(encoding='utf-8'), re.MULTILINE)
              if not m:
                  missing.append(f'{name} ({where}): pattern not found')
                  continue
              found[f'{name} ({where})'] = m.group(1)

          for item in missing:
              print(f'::error::{item}')
          if missing:
              sys.exit(1)

          for key, val in found.items():
              print(f'  {val}  {key}')

          unique = set(found.values())
          if len(unique) > 1:
              print('::error::Version mismatch across files - unify before merging:')
              for key, val in found.items():
                  print(f'  {val}  {key}')
              sys.exit(1)

          print(f'✓ Version {unique.pop()} consistent across {len(found)} locations')
          "
