name: Publish to skill registries

# 发布逻辑内联在本仓库的 .github/actions/publish，不依赖跨仓库 reusable
# workflow —— public 仓库无法调用 private 仓库的 workflow，那样会让发布静默失效。
#
# 触发：GitHub Release 发布时自动发到 ClawHub / SkillHub；也可手动 dispatch
# 重发当前 SKILL.md 的版本（dry_run=true 只校验打包；半途失败时可用两个开关
# 只补发其中一侧）。
#
# 需要仓库 secret：CLAWHUB_TOKEN（clh_...）、SKILLHUB_API_KEY（skh_...）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and package only - do not publish"
        type: boolean
        default: false
      publish_clawhub:
        description: "Publish to ClawHub（半途失败时用来只补发另一半）"
        type: boolean
        default: true
      publish_skillhub:
        description: "Publish to SkillHub（半途失败时用来只补发另一半）"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Publish to ClawHub / SkillHub
        uses: ./.github/actions/publish
        with:
          # news-report 的 SKILL.md 在仓库根目录。
          skill-dir: "."
          slug: cgartlab-news-report
          display-name: "CGArtLab News Report"
          # 留空 = 从 SKILL.md frontmatter 读版本。
          version: ""
          dry-run: ${{ inputs.dry_run || false }}
          publish-clawhub: ${{ inputs.publish_clawhub || true }}
          publish-skillhub: ${{ inputs.publish_skillhub || true }}
          clawhub-token: ${{ secrets.CLAWHUB_TOKEN }}
          skillhub-api-key: ${{ secrets.SKILLHUB_API_KEY }}
