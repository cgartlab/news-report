name: Publish to skill registries

# Publishes this skill to ClawHub and SkillHub whenever a GitHub Release is
# published. The actual work lives in the reusable workflow at
# cgartlab/cgartlab-skills/.github/workflows/publish-skill.yml so that a fix
# lands in one place for every skill repo.
#
# Prerequisites (repo settings):
#   - secret CLAWHUB_TOKEN     ClawHub API token (clh_...)
#   - secret SKILLHUB_API_KEY  SkillHub community token (skh_...)
#
# Manual runs: use "Run workflow" to re-publish the current default branch.
# Set dry_run=true to validate and package without contacting either registry.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and package only — do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    uses: cgartlab/cgartlab-skills/.github/workflows/publish-skill.yml@main
    with:
      # news-report keeps SKILL.md at the repo root.
      skill-dir: "."
      slug: cgartlab-news-report
      display-name: "CGArtLab News Report"
      # Empty = read `version:` from SKILL.md frontmatter.
      version: ""
      publish-clawhub: true
      publish-skillhub: true
      dry-run: ${{ inputs.dry_run || false }}
    secrets:
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
      SKILLHUB_API_KEY: ${{ secrets.SKILLHUB_API_KEY }}
