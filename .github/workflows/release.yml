name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Check tag matches CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "$VERSION" CHANGELOG.md; then
            echo "::error::Version $VERSION not found in CHANGELOG.md"
            echo "Please add a CHANGELOG entry before releasing."
            exit 1
          fi
          echo "✓ $VERSION found in CHANGELOG.md"

      - name: Check version consistency
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract version without leading v (e.g. v0.3.0 -> 0.3.0)
          SHORT="${VERSION#v}"
          echo "Checking version $SHORT across files..."
          FAILED=0
          for f in SKILL.md CHANGELOG.md pyproject.toml; do
            if [ ! -f "$f" ]; then
              echo "::error::$f does not exist; cannot verify version"
              FAILED=1
              continue
            fi
            case "$f" in
              SKILL.md)
                # 精确匹配 frontmatter 的 version: 字段
                if grep -E "^version:[[:space:]]*${SHORT//./\.}$" "$f" >/dev/null; then
                  echo "  ✓ $f frontmatter version = $SHORT"
                else
                  echo "::error::$f frontmatter lacks 'version: $SHORT'"
                  FAILED=1
                fi
                ;;
              CHANGELOG.md)
                # 精确匹配 Keep a Changelog 的版本标题 ## [x.y.z]
                if grep -E "^##[[:space:]]*\[${SHORT//./\.}\]" "$f" >/dev/null; then
                  echo "  ✓ $f has section [$SHORT]"
                else
                  echo "::error::$f lacks section [$SHORT]"
                  FAILED=1
                fi
                ;;
              pyproject.toml)
                # 精确匹配 project version 字段
                if grep -E "^version[[:space:]]*=[[:space:]]*\"${SHORT//./\.}\"" "$f" >/dev/null; then
                  echo "  ✓ $f version = $SHORT"
                else
                  echo "::error::$f version != $SHORT"
                  FAILED=1
                fi
                ;;
            esac
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Version consistency check failed — fix the files above before releasing."
            exit 1
          fi
          echo "✓ All version references consistent"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## What's Changed

            See CHANGELOG.md for details.

            ## Version

            ${{ steps.version.outputs.version }}

          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'alpha') }}
